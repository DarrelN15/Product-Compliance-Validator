{% extends 'compliance/base.html' %}

{% block title %}Add Product{% endblock %}

{% block content %}
    <h1 class="mb-4">Add a New Product</h1>
    
    <!-- Product Form -->
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label for="name" class="form-label">Product Name</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
        </div>
        <div class="mb-3">
            <label for="price" class="form-label">Price</label>
            <input type="number" class="form-control" id="price" name="price" required>
        </div>
        <div class="mb-3">
            <label for="weight" class="form-label">Weight</label>
            <input type="number" step="0.01" class="form-control" id="weight" name="weight">
        </div>
        <div class="mb-3">
            <label for="dimensions" class="form-label">Dimensions (LxWxH)</label>
            <input type="text" class="form-control" id="dimensions" name="dimensions">
        </div>
        <div class="mb-3">
            <label for="material_composition" class="form-label">Material Composition</label>
            <input type="text" class="form-control" id="material_composition" name="material_composition">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
    
    <a href="{% url 'product_list' %}" class="btn btn-secondary mt-3">Back to Product List</a>
{% endblock %}
