<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Compliance Standard</title>
</head>
<body>
    <h1>Add a New Compliance Standard</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Add Standard</button>
    </form>
    <a href="{% url 'standard_list' %}">Back to Standard List</a>
</body>
</html>
