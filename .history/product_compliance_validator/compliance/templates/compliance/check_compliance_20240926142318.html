{% extends 'compliance/base.html' %}

{% block title %}Check Compliance{% endblock %}

{% block content %}
    <h1 class="mb-4">Check Product Compliance</h1>

    <form method="POST" class="form-group">
        {% csrf_token %}
        
        <div class="mb-3">
            <label for="product" class="form-label">Select Product:</label>
            <select name="product" id="product" class="form-select" required>
                {% for product in products %}
                    <option value="{{ product.id }}">{{ product.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label for="standard" class="form-label">Select Compliance Standard:</label>
            <select name="standard" id="standard" class="form-select" required>
                {% for standard in standards %}
                    <option value="{{ standard.id }}">{{ standard.name }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Check Compliance</button>
    </form>
{% endblock %}
