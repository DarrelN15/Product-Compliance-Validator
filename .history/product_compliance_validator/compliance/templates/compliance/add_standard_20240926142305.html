{% extends 'compliance/base.html' %}

{% block title %}Add Compliance Standard{% endblock %}

{% block content %}
    <h1 class="mb-4">Add a New Compliance Standard</h1>

    <form method="POST" class="form-group">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Add Standard</button>
    </form>

    <a href="{% url 'standard_list' %}" class="btn btn-secondary mt-3">Back to Standard List</a>
{% endblock %}
