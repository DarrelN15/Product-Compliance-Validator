{% extends 'compliance/base.html' %}

{% block title %}Compliance Standards{% endblock %}

{% block content %}
    <h1 class="mb-4">Compliance Standards</h1>

    <table class="table table-striped">
        <thead>
            <tr>
                <th scope="col">Standard Name</th>
                <th scope="col">Description</th>
            </tr>
        </thead>
        <tbody>
            {% for standard in standards %}
                <tr>
                    <td>{{ standard.name }}</td>
                    <td>{{ standard.description }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

    <a href="{% url 'add_standard' %}" class="btn btn-primary">Add New Standard</a>
{% endblock %}
